name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # En PRs se cancela la ejecución anterior; en develop/main cada push termina (imagen y release).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1-6. Instalación, calidad, unit tests + coverage, build y artifacts
  # ---------------------------------------------------------------------------
  build:
    name: Build, lint y unit tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package: ${{ steps.meta.outputs.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # usa la versión de "packageManager" en package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Auditoría de dependencias de producción (bloquea solo vulnerabilidades críticas)
        run: pnpm audit --prod --audit-level critical

      - name: Unit tests + coverage (mínimo 85 %)
        run: pnpm test:coverage

      - name: Resumen de cobertura
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + t[k].pct + ' % |';
            console.log(['### Cobertura', '| Métrica | % |', '|---|---|', ...['lines','statements','functions','branches'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build

      - name: Empaquetar artifact
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE="orders-${VERSION}-${GITHUB_SHA::7}.tgz"
          mkdir -p .package
          cp -r dist migrations scripts package.json pnpm-lock.yaml pnpm-workspace.yaml .package/
          tar -czf "$PACKAGE" -C .package .
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Subir artifact de la aplicación
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: ${{ steps.meta.outputs.package }}
          retention-days: 30
          if-no-files-found: error

      - name: Subir reportes (coverage + JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage/
            reports/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Análisis estático con CodeQL (sin configuración externa)
  # Resultados en la pestaña Security → Code scanning.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write # subir los resultados a Code scanning
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config: |
            paths:
              - src

      - name: Análisis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: sarif-results

      - name: Gate (falla si hay hallazgos de nivel error)
        run: |
          node -e "
            const fs = require('fs');
            const dir = 'sarif-results';
            const results = fs.readdirSync(dir)
              .flatMap((f) => JSON.parse(fs.readFileSync(dir + '/' + f, 'utf8')).runs)
              .flatMap((run) => run.results ?? []);
            const count = (level) => results.filter((r) => (r.level ?? 'warning') === level).length;
            const errors = count('error');
            console.log('Hallazgos -> error:', errors, '| warning:', count('warning'), '| note:', count('note'));
            for (const r of results.filter((r) => r.level === 'error')) {
              const loc = r.locations?.[0]?.physicalLocation;
              console.log('::error file=' + loc?.artifactLocation?.uri + ',line=' + (loc?.region?.startLine ?? 1) + '::' + r.ruleId + ': ' + r.message.text);
            }
            if (errors > 0) process.exit(1);
          "

  # ---------------------------------------------------------------------------
  # Imagen Docker en GHCR (solo push a develop/main)
  # ---------------------------------------------------------------------------
  docker-image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [build, codeql]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y labels
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Release versionado (solo main, si la versión de package.json es nueva)
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: ¿Ya existe la versión?
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG ya existe; no se crea release. Sube la versión en package.json para publicar una nueva."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Crear release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "$TAG" "${{ needs.build.outputs.package }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  # ---------------------------------------------------------------------------
  # Despliegue: pendiente (plan.md §10)
  # ---------------------------------------------------------------------------
