# La organización y la project key llegan desde el workflow (variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY).
sonar.projectName=entradasya-orders

sonar.sources=src
sonar.tests=tests/unit
sonar.exclusions=src/types/**
sonar.coverage.exclusions=src/server.ts,src/types/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
